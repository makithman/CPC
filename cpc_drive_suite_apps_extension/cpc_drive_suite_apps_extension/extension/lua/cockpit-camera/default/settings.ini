[SETTINGS]
__HINT_TOP = CPC Drive Suite NeckFX backend. Use the in-game CPC Drive Suite app for live control of every setting.

; Direction following
SLIDE_FOLLOWING = 1 ; Slide following; 1 or 0
SLIDING_LOOK_MULT = 0.5 ; Slide following amount; from 0.1 to 1, perc.; only with SLIDE_FOLLOWING
TRACK_FOLLOWING = 1 ; Track following; 1 or 0
TRACK_FOLLOWING_MULT = 0.7 ; Track following amount; from 0.3 to 1, perc.; only with TRACK_FOLLOWING
STEERING_MULT = 0.7 ; Steering following (only without track spline following); from 0 to 2, perc.
LOOKAHEAD_DISTANCE = 20 ; Track following distance; from 10 m to 40, round to 5

; Six-axis movement master and force scaling
DYNAMIC_MOVEMENT = 1 ; Enable dynamic X/Y/Z and yaw/pitch/roll; 1 or 0
OVERALL_SPEED = 1.0 ; Overall effects-speed multiplier for movement, angles, slide, steering and track following; from 0.1 to 3, round to 0.1
G_FORCE_AT_FULL = 1.5 ; G-force required for full positional, pitch and roll movement; from 0.5 to 4, round to 0.1
EFFECT_SPEED_CAP = 20 ; Speed where all movement effects reach full strength; from 1 to 200, round to 1
EFFECT_SPEED_CAP_MPH = 0 ; Interpret the effects cap as mph instead of km/h; 1 or 0

; Position: X is lateral, Y is vertical, Z is forward/back
MOVE_X_DISTANCE = 0.035 ; X lateral movement distance in metres; from 0 to 0.15, round to 0.001
MOVE_X_SPEED = 9 ; X lateral response speed; from 0.5 to 30, round to 0.1
MOVE_Y_DISTANCE = 0.015 ; Y vertical movement distance in metres; from 0 to 0.10, round to 0.001
MOVE_Y_SPEED = 12 ; Y vertical response speed; from 0.5 to 30, round to 0.1
MOVE_Z_DISTANCE = 0.040 ; Z forward/back movement distance in metres; from 0 to 0.15, round to 0.001
MOVE_Z_SPEED = 9 ; Z forward/back response speed; from 0.5 to 30, round to 0.1

; Primary rotation: larger angle ranges with an independent response speed
YAW_ANGLE = 10 ; Yaw angle in degrees following steering and track trajectory; from 0 to 45, round to 0.1
YAW_SPEED = 8 ; Yaw response speed; from 0.5 to 30, round to 0.1
PITCH_ANGLE = 8 ; Pitch angle in degrees from braking and acceleration; from 0 to 30, round to 0.1
PITCH_SPEED = 9 ; Pitch response speed; from 0.5 to 30, round to 0.1
ROLL_ANGLE = 10 ; Roll angle in degrees from lateral G-force; from 0 to 45, round to 0.1
ROLL_SPEED = 9 ; Roll response speed; from 0.5 to 30, round to 0.1

; Additional dynamic angles with the same amount-and-speed layout
DRIFT_YAW_ANGLE = 12 ; Extra yaw angle from the car's slip direction; from 0 to 45, round to 0.1
DRIFT_YAW_SPEED = 9 ; Drift yaw response speed; from 0.5 to 30, round to 0.1
ROAD_PITCH_ANGLE = 8 ; Extra pitch angle following road elevation; from 0 to 30, round to 0.1
ROAD_PITCH_SPEED = 7 ; Road pitch response speed; from 0.5 to 30, round to 0.1
BANK_ROLL_ANGLE = 10 ; Extra roll angle following track banking and body attitude; from 0 to 45, round to 0.1
BANK_ROLL_SPEED = 8 ; Bank roll response speed; from 0.5 to 30, round to 0.1

; Car-speed-driven angles
SPEED_ANGLE_START_KMH = 20 ; Speed where additional speed angles begin; from 0 to 200, round to 5
SPEED_ANGLE_FULL_KMH = 180 ; Speed where additional speed angles reach full strength; from 20 to 400, round to 5
SPEED_PITCH_ANGLE = 5 ; High-speed pitch angle, positive values pitch down; from -30 to 30, round to 0.1
SPEED_PITCH_SPEED = 6 ; High-speed pitch response speed; from 0.5 to 30, round to 0.1
SPEED_YAW_ANGLE = 8 ; Speed-weighted trajectory yaw angle; from -45 to 45, round to 0.1
SPEED_YAW_SPEED = 8 ; Speed-weighted yaw response speed; from 0.5 to 30, round to 0.1
SPEED_ROLL_ANGLE = 8 ; Speed-weighted corner lean angle; from -45 to 45, round to 0.1
SPEED_ROLL_SPEED = 8 ; Speed-weighted roll response speed; from 0.5 to 30, round to 0.1

; Hidden transient head angles
HIDDEN_JERK_AT_FULL = 8 ; Acceleration change in G per second required for full hidden pitch and roll; from 1 to 30, round to 0.5
HIDDEN_YAW_RATE_AT_FULL = 1.0 ; Car yaw rate required for full hidden yaw lag; from 0.2 to 3, round to 0.1
HIDDEN_YAW_ANGLE = 3 ; Subtle neck-lag yaw angle during rapid car rotation; from -20 to 20, round to 0.1
HIDDEN_YAW_SPEED = 12 ; Hidden yaw response speed; from 0.5 to 30, round to 0.1
HIDDEN_PITCH_ANGLE = 2.5 ; Subtle pitch kick from braking, throttle and shift jerk; from -20 to 20, round to 0.1
HIDDEN_PITCH_SPEED = 14 ; Hidden pitch response speed; from 0.5 to 30, round to 0.1
HIDDEN_ROLL_ANGLE = 3 ; Subtle roll kick from rapid lateral load changes; from -20 to 20, round to 0.1
HIDDEN_ROLL_SPEED = 14 ; Hidden roll response speed; from 0.5 to 30, round to 0.1

; Eight non-recursive interpolation mixes
MIX_YAW_TO_ROLL = 0.20 ; Mix yaw output into roll; from -2 to 2, round to 0.05
MIX_ROLL_TO_YAW = 0.10 ; Mix roll output into yaw; from -2 to 2, round to 0.05
MIX_PITCH_TO_ROLL = 0.05 ; Mix pitch output into roll; from -2 to 2, round to 0.05
MIX_ROLL_TO_PITCH = 0.10 ; Mix roll output into pitch; from -2 to 2, round to 0.05
MIX_X_TO_Z = 0.15 ; Mix lateral X position into forward/back Z; from -2 to 2, round to 0.05
MIX_Z_TO_X = 0.10 ; Mix forward/back Z position into lateral X; from -2 to 2, round to 0.05
MIX_Y_TO_Z = 0.15 ; Mix vertical Y position into forward/back Z; from -2 to 2, round to 0.05
MIX_Z_TO_Y = 0.20 ; Mix forward/back Z position into vertical Y; from -2 to 2, round to 0.05

__HINT_BOTTOM = Position amounts are maximum travel per axis. Changes in the CPC Drive Suite app save automatically.
